name: OpenAlex fetch

on:
  workflow_dispatch:
  pull_request:
    paths:
      - fetch-openalex.js
      - compare-openalex.js
      - openalex-ids.json
      - people-bmi.json
      - .github/workflows/openalex.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch from OpenAlex
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: node fetch-openalex.js ./people-bmi.json > stats-openalex.js
      - name: Compare with Google Scholar
        run: |
          node compare-openalex.js stats-bmi.js stats-openalex.js > comparison.md
          cat comparison.md
          cat comparison.md >> "$GITHUB_STEP_SUMMARY"
          cat openalex-matches.json
      - uses: actions/upload-artifact@v4
        with:
          name: openalex
          path: |
            stats-openalex.js
            openalex-matches.json
            comparison.md
