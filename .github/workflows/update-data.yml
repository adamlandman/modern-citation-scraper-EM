name: Update citation data

# Weekly: fetch every person from OpenAlex, refresh stats-openalex.js, add a
# dated snapshot to history-openalex.js, and commit the result to main.
# GitHub Pages serves index.html from main, so the commit is the publish.

on:
  schedule:
    - cron: '0 10 * * 1' # Mondays 10:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - update-openalex.js
      - .github/workflows/update-data.yml

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch from OpenAlex and add to history
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: node update-openalex.js ./people-bmi.json
      - name: Commit updated data
        # On a pull request this is a dry run: show what would change.
        run: |
          git add stats-openalex.js history-openalex.js openalex-matches.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git diff --cached --stat
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update citation data $(date -u +%Y-%m-%d)"
          git push
